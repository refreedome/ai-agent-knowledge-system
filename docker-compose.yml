
services:
  api:
    build: .
    container_name: agent-knowledge-api
    ports:
      - "8000:8000"
    volumes:
      # 向量数据库持久化（容器重启后知识库不丢失）
      - ./chroma_db:/app/chroma_db
      # MD5 去重记录持久化
      - ./md5.text:/app/md5.text
      # 日志持久化
      - ./logs:/app/logs
      # 知识库文档（宿主目录 → 容器，新增文档无需重建镜像）
      - ./data:/app/data
    environment:
      # DeepSeek API 密钥（必须设置，见 .env.example）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # CORS 允许来源（生产收紧为真实域名/IP，见 .env.example）
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501,http://localhost:8000,http://127.0.0.1:8000}
      # 编码设置
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
