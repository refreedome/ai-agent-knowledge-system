collection_name: agent
persist_directory: chroma_db
k: 3
data_path: data/knowledge_base
md5_hex_store: md5.text
allow_knowledge_file_type:  ["txt", "pdf", "docx", "csv", "jpg", "jpeg", "png"]

chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# 混合检索
hybrid_search:
  enabled: true          # 是否启用混合检索
  semantic_weight: 0.5   # 语义检索权重 (0~1)
  rrf_k: 60             # RRF 融合常数