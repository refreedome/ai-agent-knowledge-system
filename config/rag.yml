# ────────────── 对话模型（Agent / RAG 生成用）──────────────
# provider 可选：
#   dashscope → 通义千问（ChatTongyi），需要环境变量 DASHSCOPE_API_KEY
#   deepseek  → DeepSeek（OpenAI 兼容协议，走 base_url），需要环境变量 DEEPSEEK_API_KEY
# 切换供应商只需要改这三行 + 对应的 key，上层代码完全不用动（见 model/factory.py）
chat_provider: dashscope
chat_model_name: qwen-plus-2025-07-28
deepseek_base_url: https://api.deepseek.com
# 想切到 DeepSeek 时改成：
#   chat_provider: deepseek
#   chat_model_name: deepseek-chat

# ────────────── 嵌入模型（知识库向量化用）──────────────
# provider 可选：
#   dashscope → text-embedding-v4（需 DASHSCOPE_API_KEY）
#   fastembed → 本地 BGE ONNX 推理（免 key、数据不出境，但首次会下载权重）
# ⚠️ 切换 embedding 供应商会让已有向量库失效（维度/向量空间不同），必须重新入库
embedding_provider: dashscope
embedding_model_name: text-embedding-v4
# 想换成免 key 的本地嵌入时改成：
#   embedding_provider: fastembed
#   embedding_model_name: BAAI/bge-small-zh-v1.5
