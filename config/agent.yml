external_data_path: data/external/records.csv


# 会话管理（短期记忆：滑动窗口 + 上下文裁剪 + 压缩）
session:
  max_rounds: 20            # 上下文窗口轮数（进模型的历史轮数上限）
  max_history_chars: 4000   # 上下文窗口总字符上限（超出从最旧消息裁剪）
  max_stored_rounds: 100    # 存储层轮数上限（远大于窗口，给压缩留原文素材）
  ttl_minutes: 30           # 会话闲置超时（分钟）
  cleanup_interval: 60      # 后台清理间隔（秒）

# 上下文压缩（Compaction：把挤出窗口的历史增量摘要，而非硬丢）
compaction:
  enabled: true             # 是否启用压缩（false 则退回「硬丢」行为）
  summary_max_chars: 400    # 单次摘要目标长度上限

# 长期记忆（跨会话用户偏好）
memory:
  max_facts: 20             # 每个用户最多记住多少条事实（FIFO 淘汰）
  recall_top: 3             # 每次注入上下文的最新事实条数
