# ─────────────────────────────────────────────────────────────
# 前端站点配置（容器内的 nginx）
#
# 这一层做的事，和开发时 Vite 的 server.proxy 完全对应：
#   开发：浏览器 → Vite(5173) --/api--> 后端(8000)
#   生产：浏览器 → nginx(80)   --/api--> 后端容器(api:8000)
# 前端代码里写的一直是相对路径 /api/...，两种环境都不用改。
#
# ⚠️ SSE 的关键：nginx 默认会缓冲上游响应，导致流式输出被攒成一次性返回。
#    必须 proxy_buffering off（后端另外还发了 X-Accel-Buffering: no 双保险）。
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩（文本类资源）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── 静态资源：带 hash 的产物长缓存 ──
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 单页应用路由回退（刷新任意前端路由都不 404）──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反代到后端容器（compose 里的服务名 api）──
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 常连接：不要带 Connection: close 之类的短连接语义
        proxy_set_header Connection        "";

        # ★ SSE 必须关缓冲，否则前端看到的是「一次性蹦出整段」
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 生成一版回答要几秒到几十秒，读超时给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
